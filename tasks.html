<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Tasks | VoiceTask AI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">🎙️</div>
        <div class="brand-title">VoiceTask AI</div>
        <span class="brand-tag">AWS Cloud</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="tasks.html" class="nav-link active">All Tasks</a></li>
          <li><a href="settings.html" class="nav-link">Settings</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="dashboard-header">
      <h1 class="dashboard-title">Task Management Matrix</h1>
      <p class="dashboard-subtitle">Organize, filter, search, and manage all your structured voice tasks</p>
    </div>

    <section class="controls-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Search tasks...">
      <button class="btn btn-primary" onclick="showToast('Manual Add Task modal ready in Phase 9', 'info')">+ Add Task Manually</button>
    </section>

    <div id="tasks-container" class="tasks-grid">
      <!-- Dynamically populated tasks -->
    </div>
  </main>

  <footer class="app-footer">
    AI Voice-to-Text Task Manager using AWS &bull; College Capstone Project
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
